        #
        # 2026-08-14 재개정 — "조용한 대화형 팟캐스트" → "잔잔한 오디오북 낭독"
        #   "팟캐스트"가 어학 학습 콘텐츠를 끌어왔다. 실측:
        #     "[쉬운 일본어] 자기 전에 듣는 일본어 팟캐스트🌙1시간(스크립트+단어장)"
