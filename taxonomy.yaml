        tone: 공감
        # 2026-08-16 — "터질"을 격분이 아니라 여기에 넣는다 (미분류 제보)
        #
        #   제보된 입력은 주어 없는 "터질거 같아" / "터질 것 같아"였다.
        #   격분(anger.rage)은 이미 화가 터진 상태이고, "터질 것 같다"는 아직
        #   터지지 않은 임계 상태다. 참다가 한계에 이른 쪽이라 억눌림이 맞다.
        #   같은 세분류에 이미 "속이터"가 있는 것도 같은 이유다.
        #
        #   ⛔ "터질것같"·"터질거같"(5자)은 넣지 않는다. 다시 넣지 말 것.
        #     길이가 길어 기존의 올바른 키워드를 전부 이겨버린다
        #     (매칭 수가 같으면 키워드 길이 합으로 정하므로).
        #     실측: "웃음이 터질 것 같아" → 웃음이(3)를 이기고 억눌림,
        #           "눈물이 터질 것 같아" → 눈물이(3)를 이기고 억눌림,
        #           "속이 터질 것 같아"  → 속이터(3)를 이기고 격분.
        #     짧은 "터질"(2)은 반대로 이것들에 져서 전부 제자리로 간다.
        #     **어간을 넓히는 것이 항상 안전한 쪽은 아니다** — 이 사전은
        #     길이로 우선순위를 정하므로, 긴 일반어는 짧은 정답을 밀어낸다.
        #
        #   "터질"이 데려오는 오탐은 joy.delight의 "빵터질",
        #   flutter.anticipation의 "대박터질"로 막았다 (둘 다 이 변경 때문에 생긴
        #   충돌이라 여기서 함께 책임진다).
        #   잔여 오탐 2건: "배가 터질 것 같아", "풍선이 터질 것 같아".
        #   갈 만한 세분류가 없어 막지 못했다. 이 앱 입력으로는 드물고,
        #   결과는 억눌림 완화 영상이라 위험하지 않다고 보고 감수한다.
        keywords: [말못하고, 말을못, 참고있, 참느라, 속으로삭, 삭이, 숨막혀, 숨이턱, 얹힌것같, 체한것같, 표현못, 눈치보느라, 눈치보여, 꾹참, 억눌,
                   가슴이답답, 속이터, 하고싶은말, 삼키, 티도못내, 내색못, 혼자삭이, 말해봤자, 들어주지않, 옥죄, 숨통막, 짓눌린, 참고만, 터질, 말을삼키,
                   속으로만, 표현을못, 억지로웃, 속에담, 꾹눌러, 목구멍까지]
        # 2026-08-14 개정 (Phase 0 확정 검색어 수정)
        #   "속 시원해지는 사연 읽기"를 뺐다. 이 검색어가 실제로 가져온 것은
        #   컬투쇼 사연 몰아보기·시월드 복수극·"참교육" 실화사연이었다.
        #   타인의 불행을 구경거리로 소비하는 콘텐츠이며, 억눌린 감정을 풀어주는 게
        #   아니라 분노를 대리 배출시키는 방향이라 완화·환기 원칙에 어긋난다.
        #   실측: 이 세분류 20건이 전부 사연 콘텐츠였다.
        #   기존 "마음 털어놓는 심리 상담 영상"과 "감정 표현 연습 강연"은
        #   새 검색어와 사실상 같은 질의라 중복 호출(각 100 units)을 피해 통합했다.
        #
        # 2026-08-14 재개정 — "속마음 정리하는 시간" → "감정 일기 쓰는 법"
        #   ⚠ "속마음"은 한국 유튜브에서 사실상 연애 타로의 관용어다.
        #     이 단어를 쓰면 검색 결과가 그쪽으로 수렴한다. 실측에서 상위 5건 중
        #     4건이 타로·재회 콘텐츠였다:
        #       "[타로]💕지금 상대방이 전하는 찐 속마음❤️‍🔥"
        #       "헤어진 후 연락을 끊었을 때 일어나는 상대방 속마음 | 재회가…"
        #     억눌린 감정을 표현하도록 돕는다는 취지와 무관하고, 타로는 불안한
        #     상태의 사용자에게 권할 콘텐츠도 아니다.
        #   같은 이유로 "말하지 못한 마음 정리"도 후보에서 뺐다 — "마음"을
