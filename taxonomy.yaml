# =====================================================================
# taxonomy.yaml — 감정 분류 체계 단일 소스 (Phase 0 초안 v2)
# 배치(Phase 1)와 앱(Phase 3)이 공유한다.
#
# 필드 설명
#   label            : 세분류 표시명
#   empathy_messages : 분류 직후 보여주는 공감 문장 (여러 개 중 매번 랜덤 1개 — 라벨 대신 이걸 먼저)
#   tone             : 추천 방향 — 위로/환기/전환/공감/증폭/유지
#                      (부정 감정은 증폭 금지, 긍정 감정만 증폭 허용)
#   keywords         : 온디바이스 세분류 보정용 사전
#   search_queries   : 배치가 사용할 유튜브 검색어 (완화·환기 원칙 전수 적용)
#   closing_messages : 영상 리스트 하단에 조용히 붙는 한 마디 (여러 개 중 매번 랜덤 1개 표시)
# =====================================================================

meta:
  version: "1.1.0"
  principle: >
    부정 감정(불안·분노·답답함·우울·지침·심심함의 일부)은 감정을 증폭시키는
    콘텐츠가 아니라 완화·환기·전환 방향으로만 검색어를 설계한다.
    긍정 감정(기쁨·설렘·평온)은 증폭·유지를 허용한다.
    모든 문구는 감정을 판단하지 않는다 — "부정적", "나쁜 감정" 같은 표현 금지.
  message_rotation_rule: >
    empathy_messages / closing_messages / ui.placeholders는 모두 매번 랜덤으로 하나를 고른다.
    단, 해당 세분류에서 직전에 보여준 문구는 제외해 반복감을 줄인다.
    empathy_messages는 사용자가 마음을 털어놓은 직후 처음 마주하는 문장이라
    반복이 가장 크게 체감되는 지점이므로 회전이 특히 중요하다.
    (구현: 세분류별 마지막 표시 인덱스를 IndexedDB settings에 저장)

# ---------------------------------------------------------------------
# 콘텐츠 blocklist 계층 (배치 필터에서 사용)
# 위기 카테고리에만 걸면 일반 우울·불안 카테고리가 무방비가 되고,
# 20종 전체를 전역 적용하면 기쁨·감사 카테고리에서 멀쩡한 영상까지 걸린다.
# → 위험도에 따라 3계층으로 나누고 적용 범위를 다르게 한다.
# ---------------------------------------------------------------------
blocklist_tiers:
  tier_a_global:
    applies_to: 모든 카테고리 (위기 포함)
    rationale: >
      자·타해와 죽음을 소재로 한 콘텐츠는 어떤 감정 상태의 사용자에게도 노출되면 안 된다.
      기쁨·설렘 카테고리에서는 애초에 검색될 일이 거의 없어 영상 확보량에 영향이 없다.
    terms: [자살, 자해, 유서, 극단적선택, 죽고싶, 죽는법, 동반자살, 실종, 시신, 살인]

  tier_b_negative:
    applies_to: 부정 감정 대분류 5종 — anxiety, anger, frustration, sadness, exhaustion
    rationale: >
      감정을 증폭시키거나 사용자를 다그치는 콘텐츠를 차단한다.
      "완화·환기 원칙"을 검색어 설계뿐 아니라 결과 필터에서도 강제하는 층.
      긍정 감정 카테고리에는 적용하지 않는다 — 기쁨·감사에서 "눈물나는 감동"은
      오히려 적합한 콘텐츠이므로 걸러내면 손해다.
    # 2026-08-14 개정 — 실제 배포본에서 걸러지지 않은 콘텐츠가 발견되어 조정했다.
    #
    #   (A) 성취압박 6종을 tier_c에서 옮겨왔다.
    #       "동기부여·자기계발·성공하는법·인생역전·돈버는법"은 위기 상태에서만
    #       부담이 되는 게 아니다. 답답함·무기력 상태의 사용자에게 "더 노력하라"는
    #       콘텐츠를 내미는 것 자체가 다그치는 일이라 tier_b의 정의에 정확히 해당한다.
    #       "우울증극복"도 함께 옮겼다 — 회복을 과제로 만드는 표현이다.
    #       실측: frustration.blocked에 동기부여 영상이 20건 중 6건 있었다.
    #
    #   (B) "우울할때듣는" → "우울할때"로 넓혔다.
    #       "삶이 지치거나 힘들고 우울할 때 봐야 할 영화"가 "듣는"이 아니라는 이유로
    #       통과했다. 같은 구조의 누락을 막으려 "슬플때", "힘들때봐야할"을 더했다.
    #
    #   (C) "사연"을 추가했다 — 근거는 아래 search_queries 개정 주석 참조.
    #
    #   (D) 사별 5종을 추가했다. 위로처럼 보이지만 실제로는 타인의 상실을
    #       소비하게 만드는 유형이라 감정 증폭의 전형이다.
    #       실측 계기: "세상 떠난 딸과 VR로 재회한 모녀"가 frustration.stuck에 있었다.
    #
    #       sadness.loss(상실감)와의 충돌은 확인했다 — 그 세분류의 검색어는
    #       연인 이별·애도 회복 쪽이고 실제 확보 20건도 전부 연인 이별이라
    #       현재 배포본 기준 겹치는 영상이 없다. 다만 검색어에 "애도와 회복 이야기"가
    #       있어 다른 날에는 사별 콘텐츠가 들어올 수 있다. 그때 걸러지는 것은
    #       의도한 동작이다 — 상실을 다루되 회복 관점이라는 이 세분류의 취지에
    #       "타인의 사별을 지켜보는" 콘텐츠는 해당하지 않는다.
    #
    #       ⛔ "먼저간"은 넣었다가 뺐다 (2026-08-14). 다시 넣지 말 것.
    #         일상 표현으로 너무 흔하다 — "친구가 먼저 간 카페", "먼저 간 사람이
    #         자리를 잡았다"가 전부 걸린다. 사별 문맥이 아닌 곳에서 걸리므로
    #         특정 세분류가 아니라 부정 감정 5개 대분류 전체에서 손실이 난다.
    #         나머지 4종(세상떠난·사별·유가족·하늘나라)은 사별 문맥에서만 걸리며
    #         이것으로 충분하다는 것이 확인됐다.
    #         용어를 추가할 때는 "이 표현이 사별이 아닌 문맥에서도 자연스러운가"를
    #         먼저 본다. 자연스럽다면 넣지 않는다.
    #
    #   (E) 서사물 관용어 7종 (2026-08-16).
    #       막장 가족 서사 낭독은 제목에 blocklist 용어가 없어 제목 필터로 잡히지 않는다.
    #         "동창회에 남편을 데려갔는데, 선생님은 그를 보자마자 물컵을 떨어뜨리며…"
    #       그래서 이 장르의 관용어를 넣는다. 일상어가 아니라 장르 표지라 오탐이 적다.
    #       "이야기"처럼 다른 카테고리에서 무해한 단어는 넣지 않는다 —
    #       그건 검색어 쪽에서 막는다(sadness.sorrow 검색어 개정 참조).
    #       제목만으로 못 잡는 채널은 channel_blocklist.yaml이 맡는다.
    terms: [슬픈노래, 이별노래, 눈물주의, 눈물나는, 오열, 최루, 새벽감성,
            우울할때, 슬플때, 힘들때봐야할,
            정신차려, 나약, 노력부족, 의지박약, 핑계,
            동기부여, 자기계발, 성공하는법, 인생역전, 돈버는법, 우울증극복,
            사연,
            세상떠난, 사별, 유가족, 하늘나라,
            며느리, 시어머니, 시댁, 불륜, 바람피, 재회했더니, 알고보니]

  tier_c_crisis_only:
    applies_to: 위기 카테고리 전용
    rationale: >
      위기 상태에서는 성취·성공을 압박하는 콘텐츠, 회복을 과제처럼 제시하는 콘텐츠까지
      부담이 된다. 이 층은 위기 카테고리에만 적용해 가장 좁고 조용한 풀을 만든다.
    # 성취압박 6종은 2026-08-14에 tier_b로 옮겼다(위 주석 참조). tier_b는 위기에도
    # 적용되므로 위기 카테고리의 차단 범위는 그대로다 — 좁아진 게 아니라 넓어졌다.
    # "사연"은 tier_b에도 있지만 여기 남겨둔다. 이 층만 읽어도 위기 정책이
    # 무엇을 막으려는지 알 수 있어야 한다.
    terms: [실화충격, 사연]

  logging: >
    배치는 계층별로 걸러낸 건수를 로그에 남긴다.
    특정 카테고리에서 과다 필터링(확보량 50% 이상 감소)이 발생하면 경고를 출력해
    용어 조정 여부를 사람이 판단할 수 있게 한다.

# ---------------------------------------------------------------------
# UI 문구 (감성 터치 레이어) — 앱이 사용하는 화면 텍스트 단일 소스
# ---------------------------------------------------------------------
ui:
  placeholders:
    rule: 진입할 때마다 랜덤 1개. 명령형("입력하세요")을 쓰지 않고 말을 거는 어조로.
    items:
      - "오늘 마음, 어땠어요?"
      - "지금 어떤 마음인지 편하게 적어주세요"
      - "무슨 일이 있었나요?"
      - "지금 기분을 한 줄로 적어봐요"
      - "잘 정리되지 않아도 괜찮아요. 떠오르는 대로"
      - "오늘 하루, 어떻게 지나갔어요?"

  entry_greetings:
    rule: 첫 화면 상단. 시간대에 따라 선택(디바이스 시계만 사용, 위치정보 없음).
    morning:   ["좋은 아침이에요", "오늘 하루가 시작됐네요"]
    afternoon: ["오후는 어떻게 지나가고 있나요", "잠깐 쉬어가는 시간이에요"]
    evening:   ["오늘 하루 수고했어요", "저녁이네요. 어떤 하루였어요?"]
    night:     ["늦은 시간까지 깨어 있네요", "조용한 밤이에요"]

  loading:
    rule: >
      분류는 실제로 수십 ms에 끝나지만 최소 노출 시간을 둔다.
      즉답은 기계적으로 느껴지고, 짧은 뜸이 "듣고 있다"는 감각을 만든다.
    decision: >
      [확정] Phase 0.5 프로토타입에서 즉답(0ms) → 800ms → 1000ms 순으로 비교한 결과
      1000ms 채택. 즉답은 기계적이고, 800ms보다 1000ms가 더 차분하게 읽힘.
    min_duration_ms: 1000
    behavior: >
      분류가 1000ms보다 오래 걸리면 실제 소요 시간을 사용한다(추가 지연 없음).
      로딩 중에는 호흡 애니메이션이 한 사이클 돌아 "같이 숨 쉬는" 인상을 만든다.
      prefers-reduced-motion 설정 시 애니메이션은 끄되 지연은 min_duration_ms 그대로
      1000ms를 유지한다. 뜸을 들이는 것이 "듣고 있다"는 감각을 만드는 장치이고,
      그 감각은 애니메이션이 아니라 시간에서 나오기 때문이다.
      (이 문장에 800ms가 적혀 있었으나 min_duration_ms·decision과 어긋난 이전 검토의
       잔재였다. 값은 한 곳에서만 읽는다 — min_duration_ms.)
    messages:
      - "마음을 읽는 중이에요"
      - "천천히 들여다보는 중이에요"
      - "당신의 마음에 어울리는 걸 찾는 중이에요"
      - "조금만 기다려주세요"

  empty_input:
    rule: 아무것도 입력하지 않고 확인을 눌렀을 때. 오류가 아니라 초대처럼.
    items:
      - "한 단어여도 괜찮아요"
      - "말로 안 되면 아래에서 골라도 돼요"

  no_match:
    rule: 분류에 실패했을 때. 사용자 탓으로 만들지 않는다.
    message: "제가 잘 못 알아들었어요. 아래에서 가까운 마음을 골라주실래요?"

  select_mode:
    rule: 대분류→세분류 선택 UI의 안내 문구
    step1: "지금 마음에 가장 가까운 건 어느 쪽인가요?"
    step2: "조금 더 자세히 알려주실래요?"
    switch_to_text: "직접 적고 싶어요"
    switch_to_select: "골라서 찾을래요"

  revisit:
    rule: >
      방문 간격에 따라 다른 인사를 표시한다. 판단 근거는 전부 온디바이스 기록이며
      서버·로그인·계정이 필요 없다.
    implementation:
      storage: IndexedDB settings 스토어
      fields:
        - last_visit_at        # ISO 문자열, 방문할 때마다 갱신
        - visit_count_today    # 날짜가 바뀌면 0으로 리셋
        - last_subcategory_id  # 직전에 분류된 세분류 (마음의 변화 언급용)
      logic: >
        앱 진입 시 last_visit_at을 읽어 현재 시각과 비교한다.
        같은 날(로컬 날짜 기준)이고 visit_count_today >= 1 → same_day
        1~3일 전 → recent / 7일 이상 전 → long_absence / 기록 없음 → first_visit
      limitations: >
        브라우저 데이터 삭제·시크릿 모드·다른 기기에서는 기록이 없어 first_visit으로 처리된다.
        이는 오작동이 아니라 정상 동작으로 취급하며, 어떤 경우에도 "왜 안 왔냐"는
        식의 문구를 쓰지 않는다. 기록이 없으면 조용히 기본 인사로 돌아간다.
      privacy_note: 방문 기록은 기기 밖으로 나가지 않는다. 설정에 기록 삭제 버튼을 둔다.
    first_visit:
      - "처음 오셨네요. 편하게 적어주시면 돼요"
      - "반가워요. 오늘 마음은 어떤가요?"
    # 같은 날 다시 온 경우. 문구를 두 갈래로 나눈다.
    #
    # same_day        — 횟수를 말하지 않는다. 2회차든 5회차든 언제나 맞다.
    # same_day_second — 횟수를 말한다. **2회차에서만** 쓴다.
    #
    # 나눈 이유: "오늘 두 번째네요"가 3~4번째 방문에서도 나왔다.
    #   visit_count_today를 읽지 않고 same_day 목록 전체에서 랜덤으로 골랐기 때문이다.
    #   틀린 숫자를 말하는 것보다 숫자를 아예 말하지 않는 쪽이 낫다 —
    #   숫자가 틀리면 "이 앱이 나를 제대로 보고 있지 않다"는 인상을 준다.
    #   그래서 횟수를 세는 문구는 확실할 때(2회차)만 쓰고, 그 외에는 배제한다.
    same_day:
      - "다시 오셨네요. 마음이 좀 달라졌나요?"
      - "또 오셨군요. 오늘 하루가 길죠"
      - "언제든 다시 와도 되는 곳이에요"
      - "괜찮아요, 자주 와도 돼요"
      - "오늘은 여기 자주 들르게 되네요"
      - "언제 와도 자리는 비워둘게요"
      - "마음이 다시 여기까지 왔네요"
      - "지금은 어떤 마음인가요?"
    same_day_second:   # 2회차 전용 — 횟수를 말하는 유일한 문구
      - "오늘 두 번째네요. 괜찮아요, 자주 와도 돼요"
      - "오늘만 두 번이네요. 그런 날도 있어요"
    recent:
      - "어제도 오셨었죠. 오늘은 좀 어때요?"
      - "다시 만나서 반가워요"
      - "요즘 자주 오시네요. 잘 지내고 계신가요?"
    long_absence:
      - "오랜만이에요. 그동안 잘 지내셨어요?"
      - "다시 오셨네요. 반가워요"
      - "한참 만이네요. 오늘은 어떤 마음인가요?"

# ---------------------------------------------------------------------
# 입력 정규화 규칙 (매칭 전 반드시 적용 — 앱/배치 공통 구현)
# 띄어쓰기가 달라도 매칭되도록 하는 핵심 장치.
# ---------------------------------------------------------------------
normalization:
  steps:
    - id: strip_whitespace
      desc: 입력과 키워드 양쪽에서 모든 공백 제거 후 비교
      example: "마음이 급해 → 마음이급해 / 마음이급해 → 마음이급해 (둘 다 매칭)"
    - id: collapse_repeats
      desc: 3회 이상 반복 문자를 2회로 축약
      example: "짜증나아아아 → 짜증나아 / ㅠㅠㅠㅠ → ㅠㅠ"
    - id: strip_punctuation
      desc: 문장부호·이모지 제거 (단, ㅠㅜㅋ 등 감정 자모는 보존)
      example: "너무 힘들다... → 너무힘들다"
    - id: normalize_jamo
      desc: 단독 자모 정규화 (ㅜ→ㅠ, ㅎㅎ/ㅋㅋ 통합 처리)
    - id: lowercase
      desc: 영문 소문자화 (스트레스/stress 혼용 대비)
  keyword_rule: >
    keywords 항목은 어간 중심으로 짧게 작성한다.
    "짜증나다/짜증나요/짜증났어/짜증나네"를 모두 잡기 위해 "짜증나"까지만 적는다.
    조사·어미 변화는 부분 문자열 포함(includes) 매칭으로 흡수한다.
  keyword_rule_limit: >
    단, 어간을 짧게 줄이는 것이 기본값이지 항상 옳은 것은 아니다. 두 가지 예외가 있다.
    (1) 그 문자열이 일상어 안에 들어가면 줄이지 않고 활용형을 하나씩 적는다.
        "처지"는 처지(處地)를, "무료"는 무료 배송을, "정체"는 교통 정체를 삼킨다.
    (2) 매칭 수가 같을 때 키워드 길이 합으로 순위를 정하므로, **긴 일반어는 짧은
        정답을 밀어낸다.** "터질것같"(5자)을 넣으면 "웃음이"·"눈물이"·"속이터"(각 3자)가
        전부 밀려 엉뚱한 세분류로 간다. 이때는 오히려 짧게 둬야 제자리로 간다.
    (3) 어간이 **방향을 뒤집는** 경우가 있다. 한글은 음절 단위라 한 음절 차이로
        자기 서술은 놓치고 타인 서술만 잡을 수 있다 — `애처로`가 그랬다.
        검사 절차는 safety의 [어간 원칙] 3번에 있다. 위기 키워드뿐 아니라
        감정 키워드에도 같은 절차를 쓴다.
    새 키워드는 넣기 전에 그 문자열이 들어가는 일상 문장을 만들어 돌려보고,
    기존 키워드와 경합할 때 어느 쪽이 이기는지도 함께 확인한다.

# 2026-08-16 사전 일괄 보강 — 577 → 854개 (세분류당 30~57개)
#
#   하나씩 제보받아 고치는 방식의 한계가 드러나 일반 감정 어휘 목록을 참고해
#   24개 세분류의 빈칸을 한 번에 메웠다. 제보분(힘들어·싸우고싶·도망치고싶·헛헛·
#   욕설·이해되지않)도 여기 포함된다.
#
#   검증: 필수 통과 30건 전수 통과, 신규 오탐 0건.
#   기존 키워드가 일상어와 충돌하던 것 13건도 함께 정리했다 (아래).
#
#   ⛔ 아래 키워드는 일상어를 삼켜서 뺐다. 다시 넣지 말 것.
#     무료   (boredom.dull)         ← 무료 배송
#     한가   (calm.ease)            ← 한가운데        → 한가해·한가로
#     여유   (calm.ease)            ← 여유 자금       → 여유가·여유로·여유있
#     정체   (frustration.blocked)  ← 교통 정체       → 정체기
#     방전   (exhaustion.burnout)   ← 배터리 방전     → 에너지가바닥
#     소진   (exhaustion.burnout)   ← 포인트 소진     → 소진돼
#     한계   (exhaustion.burnout)   ← 한계효용       → 한계에다다
#     균형   (calm.stable)          ← 균형 잡힌 식단  → 마음이균형
#     고요   (calm.stable)          ← 고요한 밤      → 고요해진
#     잔잔   (calm.stable)          ← 잔잔한 파도    → 잔잔해진
#     보고싶 (sadness.loss)         ← 영화 보고 싶어  → 너무보고싶·많이보고싶
#     상실   (sadness.loss)         ← 상실 신고      → 상실감
#
#   남겨둔 것: "하품"(exhaustion.tired). "하품이 나올 만큼 길었어"가 지루함으로
#   가야 맞지만 피로로 간다. 방향이 크게 틀리지 않고 대체 표현이 마땅치 않아 둔다.
#
# 2026-08-18 누락 어휘 후보 24종 어간 폭 검증 — 10종 채택(키워드 14개), 14종 배제
#   878 → 892개
#
#   HANDOFF에 "참고 목록 대조에서 나온 후보"로 적어둔 것을 오탐 코퍼스로 재고 넣었다.
#   `꼴보기싫`은 이미 있어 제외하고 23종을 검증했다.
#   검증: 필수 통과 전수, 오탐 코퍼스 28건 0건, 기존 코퍼스 113건 회귀 0건.
#
#   ⚠ 배제 사유가 두 종류다. 섞지 말 것 — 되돌리는 조건이 다르다.
#     (A) 오탐·정책 충돌 9종        → 다시 넣지 않는다. 조건이 없다
#     (B) 빈도 미달 5종 + 형태 2개  → 오탐은 없었다. 실사용 기록을 보고 다시 넣을 수 있다
#
# ---------------------------------------------------------------------
# (A) 오탐·정책 충돌로 배제한 9종 — **다시 후보로 올리지 말 것**
#     같은 검증을 반복하지 않도록 사유를 남긴다.
#
#     하찮      ← 배제 사유가 다른 것들과 다르다. 오탐이 아니라 **정책 충돌**이다.
#                 "내가 하찮게 느껴져"는 자기 비하 = 수치심 계열이고, 이 체계는
#                 아래 [결정 기록]에서 그것을 **의도적으로 미분류로 두기로** 했다.
#                 주어를 고정하면(내가하찮·하찮게느껴) 오탐 0으로 통과하지만,
#                 통과한다고 넣으면 수치심을 뒷문으로 들이는 셈이 된다.
#                 넣으려면 먼저 [결정 기록]의 수치심 보류를 뒤집어야 한다.
#                 (사물 주어 오탐도 함께 있었다 — "하찮은 일에 신경 쓰지 마")
#     메스꺼    ← 신체 증상이다. "속이 메스꺼워서 병원 갔어", "차만 타면 메스꺼워"
#     눈물겨    ← **감정가가 반대다.** "눈물겨운 노력", "눈물겨운 투혼"은 감탄이다.
#                 슬픔으로 보내면 칭찬을 위로로 되받는다
#     안타까    ← 타인·사건이 주 대상이다. "안타까운 사고 소식", "안타깝게도 매진"
#     고리타분  ← 사물 평가다. "고리타분한 생각/회사 문화/디자인"
#     탄식      ← 타인 서술이 주 용법이다. "관중석에서 탄식이 터져 나왔다".
#                 자기 지향은 `신세한탄`으로 채택했으므로 이쪽은 불필요
#     혐오스러  ← 외부 대상이다. "혐오스러운 댓글/장면"
#     역겨/역겹 ← 신체 감각과 콘텐츠 평가다. "냄새가 역겨워", "연출이 역겹다".
#                 `역겨`는 냄새를, `역겹`으로 좁혀도 콘텐츠 평가를 잡는다
#     약오르    ← 어간 그대로는 **계약**에 걸린다. "전세 계약 오르기 전에",
#                 "월세 계약 오른다고". 활용형(약올라·약오른다·약올랐)도 전부
#                 "계약 올라/오른다/올랐다"에 걸려 오탐 4/4였다.
#                 → `약이올라`·`약이오르`로 주어를 고정해 채택했다
#
#   ⚠ 어간이 **반대쪽만 잡는** 사례를 이때 처음 만났다 — `애처로`.
#     "애처로운 눈빛"(타인 서술)은 잡고 "애처롭게 느껴져"(자기 서술)는 놓친다.
#     음절 경계 때문이다(애처로+운 ↔ 애처롭+게). 정확히 뒤집힌 결과였다.
#     `애처롭`으로 바꾸면 자기 서술 2/2 포착·타인 서술 3/3 배제로 깨끗이 갈렸지만,
#     빈도 미달로 (B)에서 뺐다. **검사 절차는 이 사례에서 나왔다** —
#     safety의 [어간 원칙] 검사 3번 항목을 볼 것.
#
#   음절 경계로 활용형을 개별 등록한 것: 맥빠지→맥빠져·맥빠진다·맥이빠,
#   주눅드→주눅들·주눅든.
#
# ---------------------------------------------------------------------
# (B) 빈도 미달로 배제한 5종 + 형태 2개
#     **조건이 붙은 배제다. (A)와 다르게 취급한다**
#
#   ⛔ 침통 · 신세한탄 · 애처롭 · 암담 · 끔찍(주어 고정형)
#   ⛔ 설움이북받 · 서러움이북받  (북받치의 문어체 형태 — 개념 자체는 채택했다)
#
#   오탐 때문이 아니라 앱 입력으로 드물어서 뺐다.
#   실사용 실패 기록에 이 계열이 나타나면 그때 다시 넣는다.
#
#   `북받치`는 개념을 채택하되 형태를 하나로 줄였다.
#     남긴 것: 울음이북받 — "울음이 북받쳐"는 구어에서 쓰인다
#     뺀 것  : 설움이북받 · 서러움이북받 — 설움·서러움이 문어체다
#   주어 고정이 필요한 것은 그대로다. 어간 `북받치`는 활용형(북받쳐)을 못 잡고,
#   주어를 안 고정하면 "기쁨이 북받쳐"(긍정)를 슬픔으로 가져간다.
#
#   전부 검증은 통과했다 — 주어 고정·활용형으로 좁혀 오탐 0건이었고
#   기존 코퍼스 회귀도 0건이었다. 뺀 근거는 다른 데 있다.
#     - 문어체라 감정 입력 상자에 적힐 말이 아니다
#       ("침통한 기분이야", "신세한탄만 하게 돼", "앞날이 암담해")
#     - **사전이 커지면 길이 규칙 경합면이 넓어진다.** 쓰이지도 않을 긴 키워드가
#       나중에 짧은 정답을 밀어낼 자리만 만든다 (`터질것같` 사례 참조)
#     - `암담`은 특히 약했다. "앞날이 암담해"는 이미 `앞날이`로 anxiety.worry에
#       잡히고 있어서, 이 키워드의 효과는 frustration.stuck으로 **경로가 바뀌는 것뿐**
#       이었다. 순수 신규 포착이 아니다
#
#   다시 넣을 때: 위 (A)와 달리 어간 검증을 처음부터 다시 할 필요는 없다.
#   당시 통과한 형태를 그대로 쓰면 된다 —
#     침통한기분 · 마음이침통 · 신세한탄 · 신세를한탄 · 애처롭 ·
#     앞날이암담 · 미래가암담 · 인생이암담 · 하루가끔찍 · 생각만해도끔찍 ·
#     설움이북받 · 서러움이북받
#   ⛔ 단, 어간을 그대로(침통 · 한탄 · 애처로 · 암담 · 끔찍) 쓰지는 말 것.
#      그 형태는 (A)의 사유에 해당한다.
#
#   감수하는 오탐(전부 타인의 감정을 전하는 문장이라 감정 입력 상자에 적힐 말이 아니다):
#     "그는 못마땅한 표정으로", "언짢으셨다면 사과드립니다",
#     "낙심하지 말라고 하더라", "아이가 주눅들지 않게", "지긋지긋한 장마가 끝났다".
#     걸려도 그 감정 자체는 맞고 결과는 완화 영상이라 위험하지 않다.
#
#   ⛔ `분한`은 검증 대상에도 넣지 않았다 — 차분하다·충분하다에 걸려
#     2026-08-14에 뺀 이력이 있다. 위 제거 목록과 같은 취급이다.
#
#   ⚠ 이 체계에 없는 감정: 부끄러움·죄책감(수치심) 계열.
#   참고한 목록에는 있었으나 우리 9개 대분류 어디에도 넣을 자리가 없어 매핑하지 않았다.
#   "쪽팔려", "미안해", "자책"은 지금도 미분류로 남는다.
#   추가 여부는 아래 결정 기록 참조 — **검토했고 의도적으로 뺐다.**

# =====================================================================
# [결정 기록] 수치심 대분류 — 검토 후 보류 (2026-08-16)
# =====================================================================
#   "수치심이 없네?" 하고 그냥 추가하지 말 것. 빠뜨린 게 아니라 검토하고 뺀 것이다.
#   추가하려면 아래 세 가지가 해소됐는지 먼저 확인한다.
#
#   쿼터는 문제가 아니었다. 세분류 2개 = +605 units로 7,878 → 8,483,
#   하드캡 9,800 이내다 (배치의 build_estimate로 실측).
#   다만 추가한다면 quota_log.py의 ACTIONS_BATCH_RESERVE를 7,900 → 8,483으로
#   함께 올려야 한다. 안 올리면 로컬에서 배치 몫을 과소 예약해 이중 소모가 난다.
#
#   보류 이유는 안전이다.
#
#   (a) 검색어를 실측 없이 확정할 수 없고, 실측에 최소 하루가 걸린다.
#       이 프로젝트는 검색어를 실측 없이 넣었다가 세 번 실패했다
#       (사연 / 속마음 / 팟캐스트 — 각 세분류 주석 참조).
#       수치심은 그중 위험도가 가장 높은데, 자연스러운 검색어가 하필
#       이미 차단 중인 장르와 정면으로 겹친다 — "죄책감 극복", "자존감 회복"의
#       극복·자기계발·동기부여는 전부 tier_b_negative 항목이다.
#       tier_b에 "우울증극복"을 넣은 이유가 "회복을 과제로 만드는 표현"이었는데,
#       수치심 검색어는 그 함정에 가장 빠지기 쉽다. 확보량이 무너지거나,
#       통과한 것들이 오히려 "더 노력하라"는 콘텐츠일 위험이 있다.
#
#   (b) 이 계열은 위험도가 균질하지 않다.
#       상황적 창피(쪽팔려·민망·어색)와 자기 비난(내가 다 망쳤어·나 때문이야)은
#       위기 인접도가 완전히 다른데, 한 대분류로 묶으면 같은 검색어 세트와
#       같은 톤을 공유하게 된다. 자기 비난에 맞춰 설계하면 창피에는 과하고,
#       창피에 맞추면 자기 비난에 위험하다.
#
#   (c) 지금의 미분류가 실제로 안전한 경로다. ← 결정적 근거
#       "내가 다 망쳤어"는 현재 미분류 → 선택 UI → 사용자가 직접 고른다.
#       자책 상태의 사용자가 자기 마음을 스스로 규정하는 편이,
#       우리가 잘못 규정해 자책 완화를 표방한 영상을 내미는 것보다 안전하다.
#       ui.no_match의 "제가 잘 못 알아들었어요"가 오분류보다 나은 자리다.
#
#   대신 이 검토에서 나온 것이 위 safety의 부담감 8종이다.
#   수치심 카테고리 없이도 고위험 자책은 위기 경로로 잡힌다 —
#   실제로 막아야 했던 것은 카테고리가 아니라 그 구멍이었다.
#
#   재검토 조건: 실패 기록(app/src/lib/failures.js)에 수치심 계열 입력이
#   유의미하게 쌓이면 그때 (a)의 검색어 실측부터 시작한다.

# =====================================================================
# [결정 기록] Phase 2 온디바이스 모델 — 검토 후 보류 (2026-08-18)
# =====================================================================
#   PLAN.md 로드맵에 Phase 2가 남아 있다고 착수하지 말 것.
#   빠뜨린 게 아니라 자료를 만들어 검토하고 보류한 것이다.
#   (PLAN.md "Phase 2" 절에 같은 결정이 상세히 적혀 있다.)
#
#   지금 분류는 이 사전 단독으로 동작하고 실사용 문장 커버리지 98.6%다
#   (scripts/coverage_test.py, 하한 80%).
#
#   보류 이유는 셋인데, 앞의 둘은 비용이고 (c)가 결정적이다.
#
#   (a) 개선 상한이 9%p인데 그 근거가 약하다.
#       코퍼스 80건 중 모델이 건드릴 수 있는 것은 10건이고(문장형 9 + 오분류 1)
#       현실적 포착은 6~7건이다. 게다가 그 문장형 9건은 실사용 입력이 아니라
#       **개발자가 지어낸 예시**다. 실사용 실패 데이터가 아직 없는 상태에서
#       모델이 실재하는 문제를 푸는지 확인할 방법이 없다.
#
#   (b) 앱 번들이 330KB다. 10MB 모델은 30배 증가다.
#       이 앱은 "마음이 힘들 때 여는" 것이라 첫 로딩이 길어지는 대가가 크다.
#
#   (c) 모델은 "모르겠다"를 말하지 못한다.  ← 결정적 근거
#       문장형 중 유형 D("시간이 물처럼 흘러가 버렸어요")는 감정가 자체가
#       모호해 사람도 못 가른다. 사전은 여기서 자연스럽게 미분류가 되지만,
#       **임계값 없는 모델은 항상 최근접 후보를 자신 있게 내놓는다.**
#       못 잡는 데서 그치지 않고 확신을 갖고 틀린다.
#
#       위 수치심 결정 기록의 (c)와 정확히 같은 논리다 —
#       "사용자가 자기 마음을 스스로 규정하는 편이, 우리가 잘못 규정하는
#        것보다 안전하다." ui.no_match의 "제가 잘 못 알아들었어요"가
#       오분류보다 나은 자리라는 판단은 여기서도 그대로 성립한다.
#       미분류 → 선택 UI는 우회로가 아니라 이 프로젝트의 안전 철학이고,
#       모델을 넣는 것은 그 경로를 좁히는 일이다.
#
#   ⚠ 위기 경로는 이 판단과 무관하다. classify.js는 위기 검사를 점수 계산보다
#     먼저 끝내고 반환하므로, 나중에 모델이 들어와도 위기 경로에 닿지 않는다.
#     모델을 넣을 때도 이 순서를 깨지 말 것.
#
#   재검토 조건 (셋 다 충족될 때)
#     1. 실패 기록에 실사용 미분류가 30건 이상 쌓일 것
#     2. 그중 절반 이상이 유형 A(신체 환유 — "어깨가 무겁다", "가슴이 내려앉다")일 것
#        관용구라 임베딩이 실제로 잡을 수 있는 유형이다. 유형 D가 대부분이면
#        모델을 넣어도 (c)의 문제만 커진다
#     3. 후보 모델 크기를 실측해 5MB 이하가 가능할 것 (10MB에서 하향)
#
#     조건 1은 자동으로 충족되지 않는다. failures.js는 전송 경로가 없어 기록이
#     그 기기의 IndexedDB에만 남는다(최근 50건, 위기 입력은 미기록).
#     확인: 배포본 콘솔에서 await __fym.failures()
#
#   착수한다면 문장 임베딩 + 유사도 방식이다 (분류 모델 파인튜닝이 아니다).
#   학습 데이터가 0건이고, 무엇보다 폴백 구조가 지금 설계와 그대로 겹쳐
#   임계값 미달 시 미분류로 남길 수 있다 — 위 (c)를 지킬 수 있는 유일한 배치다.
#   비교표와 상세는 PLAN.md Phase 2 절에 있다.
  matching: >
    정규화된 입력 문자열에 대해 정규화된 키워드의 부분 문자열 포함 여부를 검사한다.
    복수 세분류가 매칭되면 (1) 매칭된 키워드 수, (2) 키워드 길이 합(긴 키워드 우선)
    순으로 점수를 매겨 최상위를 선택한다.

# ---------------------------------------------------------------------
# 안전 장치: 위기 신호 감지 (분류보다 항상 먼저 검사)
# ---------------------------------------------------------------------
safety:
  # 2026-08-16 — 자기 지향 가드 5종 추가 (나를죽이 ~ 나를없애)
  #   anger.rage에 "죽여버리·죽이고싶·없애버리고싶"을 넣으면서 생긴 구멍을 막는다.
  #   "죽여버리고 싶어"는 타인 지향이라 격분이 맞지만, "나를 죽이고 싶어"는
  #   자해 의사인데 기존 위기 키워드 어디에도 걸리지 않아 격분으로 분류됐다.
  #   자해를 말한 사람에게 분노 완화 영상을 내미는 것이 최악의 오분류다.
  #   위기 검사가 감정 분류보다 먼저 돌므로, 여기 넣으면 순서로 해결된다.
  #
  #   경계 사례: "그 사람이 나를 죽이려고 해"처럼 위협받는 상황도 위기로 잡힌다.
  #   상담 안내를 불필요하게 보여주는 방향의 오탐이며, 자해를 놓치는 것보다 낫다고 본다.
  #
  # =====================================================================
  # [경계선 원칙] 자책은 위기가 아니다. 자책 + 부담감이 위기다.
  # =====================================================================
  #   이 기준을 여기 못박아 둔다. 없으면 나중에 두 방향 중 하나로 흔들린다 —
  #   자책 표현을 통째로 위기로 넣거나, 반대로 부담감 표현을 "그냥 자책"이라며 빼거나.
  #
  #   ✗ 위기가 아니다 — 결과에 대한 책임 귀속
  #       "내가 다 망쳤어"  "나 때문이야"  "내 잘못이야"  "자책하게 돼"
  #       극히 흔한 표현이다. 이걸 위기로 보내면 상담 안내가 남발되어
  #       **진짜 위기에서 안내의 무게가 떨어진다.** 위기 경로를 희석하는 것도
  #       놓치는 것 못지않게 위험하다.
  #       → 미분류로 두고 선택 UI로 보낸다. 자책 상태의 사용자가 자기 마음을
  #         스스로 규정하는 편이, 우리가 잘못 규정하는 것보다 안전하다.
  #
  #   ✓ 위기다 — 자기 존재에 대한 판단 (부담감)
  #       "나만 없으면 다 잘될 텐데"  "내가 없어야 다들 편할 거야"
  #       "나 같은 건 없는 게 나아"  "내가 태어나지 말았어야 했어"
  #       자살 위험 평가에서 핵심 지표로 쓰이는 유형이고, 표현이 정형화돼 있어
  #       키워드로 잡을 수 있다.
  #
  #   가르는 지점: **결과를 탓하는가, 존재를 탓하는가.**
  #       "나 때문에 다 망했어"                        → 위기 아님
  #       "나 때문에 다 망했어, 나만 없으면 됐을 텐데"   → 위기
  #
  # =====================================================================
  # [어간 원칙] 위기 키워드는 자기 지향이 문법적으로 드러나야 한다
  # =====================================================================
  #   "의미가없"처럼 목적어만 바뀌면 뜻이 완전히 달라지는 어간은 쓰지 않는다.
  #
  #   2026-08-18 실측 — "의미가없"이 운영 중에 이런 입력을 전부 위기로 보냈다.
  #       "이 회의는 의미가 없어"   "이 기능은 의미가 없어"
  #       "지금 와서 사과는 의미가 없어"   "숫자만 늘리는 건 의미가 없어"
  #     업무 얘기를 적은 사용자에게 상담 전화번호가 떴다.
  #     위 [경계선 원칙]이 경고한 "위기 경로 희석"이 이미 일어나고 있었다.
  #     → 사는게의미가없 · 살의미가없 · 살아갈의미가없 · 존재의미가없으로 좁혔다.
  #
  #   새 키워드를 넣기 전 검사 (위기 키워드는 필수, 감정 키워드도 같은 절차를 쓴다):
  #
  #     1. [너무 넓은가] 그 문자열 앞에 사물·타인·장소를 주어로 붙여 문장을 만든다.
  #        자연스러운 문장이 만들어지면 그 어간은 쓸 수 없다.
  #          예) "의미가없" → "이 회의는 의미가 없어"  ✗ 자연스럽다 → 쓰지 않는다
  #              "나만없으면" → "이 회의는 나만 없으면"  ✓ 어색하다 → 쓸 수 있다
  #
  #     2. [너무 좁은가] 좁힌 형태로 흔한 표현이 빠지지 않는지 실측한다.
  #        `살기싫`을 좁혔더니 "살기 싫어" 같은 본체가 통째로 빠졌다(아래 전수 점검).
  #
  #     3. [방향이 반대인가] ← 2026-08-18 추가
  #        **자기 서술과 타인 서술을 각각 만들어보고,
  #          잡아야 할 쪽(자기 서술)이 잡히는지 확인한다.**
  #        1번만 보면 "타인 서술이 안 잡히는가"까지만 확인하게 되는데,
  #        한글은 음절 단위라 어간이 **정확히 반대쪽만** 잡는 경우가 있다.
  #          예) `애처로` → "애처로운 눈빛"(타인) 잡힘 · "애처롭게 느껴져"(자기) 놓침
  #              애처로+운 ↔ 애처롭+게 — 한 음절 차이로 방향이 뒤집힌다.
  #              `애처롭`으로 바꾸면 자기 2/2 포착·타인 3/3 배제로 갈린다.
  #        1번을 통과해도(타인 서술이 안 잡혀도) 자기 서술마저 안 잡히면
  #        그 어간은 아무 일도 못 하는 것이다. 두 방향을 함께 재야 알 수 있다.
  #        (감정 키워드에서 나온 사례지만 위기 키워드에 더 중요하다 —
  #         자기 지향을 놓치는 것이 이 절의 핵심 위험이기 때문이다)
  #
  #   같은 검사를 기존 키워드에도 돌렸고, 결과는 아래 [전수 점검]에 있다.
  #
  # 2026-08-16 — 부담감 8종 추가 (나만없으면 ~ 태어나지말았)
  #   위 원칙을 적용해 보니 이 유형이 통째로 빠져 있었다. 기존 키워드가 죽음·자해의
  #   직접 표현에 맞춰져 있어서다 — "내가없어지"는 있는데 "내가없어야"는 없는 식이었다.
  #   실측: 고위험 자책 7종이 전부 미분류였다.
  #
  #   감수하는 오탐 2건: "나만 없으면 팀이 안 돌아가", "나만 없으면 다들 심심할걸".
  #   "나만없으면"은 같은 표현이 정반대 뜻이 되는 양면적 어구라 키워드로는 가를 수 없다.
  #   상담 안내를 불필요하게 보여주는 방향이라 감수한다 (위 자기 지향 가드와 같은 판단).
  #   ⛔ 이 오탐 때문에 "나만없으면"을 빼지 말 것. 빼면 부담감 표현의 대표형을 놓친다.
  #
  #   어간을 좁혀 제거한 오탐: "살 자격증 땄어"(→ 살자격이없),
  #   "내가 사라지는 마술"(→ 내가사라지는게·내가사라져야).
  #
  # 2026-08-16 — 존재를 묻는 표현 14종 추가 (왜태어났을까 ~ 왜살아야할지모르)
  #   "나는 왜 태어났을까"가 미분류였다. "태어나지말았"은 있는데 자문 형태가 빠졌다.
  #   경계선 원칙상 존재 자체를 묻는 것이므로 위기다.
  #
  #   ⛔ 어간을 그대로 쓰면 안 된다. 다섯 후보(왜태어났·태어난이유·왜사는지·
  #     왜살아야·존재이유가)를 그대로 넣어보니 **오탐 9/9**였다.
  #       "사람들이 왜 사는지 궁금해"  "이 제품이 태어난 이유"
  #       "존재 이유가 분명한 제품"    "왜 살아야 하는지에 대한 강의"
  #     전부 일상 어구다. 이 표현들은 사물·타인을 주어로 삼는 순간 무해해진다.
  #
  #   가르는 것은 두 가지 앵커다.
  #     (1) 1인칭   — 내가/내. 사물·타인 주어를 배제한다.
  #     (2) 의문·부정 — 모르겠/없/뭘/뭔. **해소된 표현을 배제한다.**
  #   (2)가 특히 중요하다. 1인칭만 걸면 "내가 태어난 이유가 있다고 믿어",
  #   "왜 태어났는지 이제 알겠어" 같은 자기 긍정이 위기로 간다.
  #   의미를 찾은 사람에게 상담 안내를 내미는 건 사물 오탐보다 나쁘다.
  #
  #   실측: 잡아야 할 14건 전부 포착, 일상 대화 10건·긍정 표현 8건 모두 미포착.
  #
  # 2026-08-18 — 자포자기 1종 + 무망감 5종 추가, 의미가없 좁힘
  #
  #   자포자기: 일관성 보정이다. "다 포기하고 싶어"(욕구)가 위기인데
  #     "자포자기 상태야"(이미 포기한 상태)가 아니면 앞뒤가 맞지 않는다.
  #     단어 자체가 自暴自棄 — 자기를 버림이라 [경계선 원칙]의 "자기 존재에
  #     대한 판단"에 정확히 해당한다.
  #     감수 오탐 2건: "자포자기하지 말라고 했어"(타인 조언),
  #     "자포자기 심정으로 하나 샀어"(과장). 감정 입력 상자에 적힐 말은 아니다.
  #
  #   무망감(절망): ⛔ "절망"·"절망적"·"절망스러"·"희망이없"은 넣지 않는다.
  #     실측 오탐 6/6이었다 — "경기가 절망적이야", "성적이 절망적이네",
  #     "이 팀 수비가 절망적이다", "날씨가 절망적이야", "이 팀은 희망이 없어".
  #     "절망적"은 상황 과장의 관용어다. 주어가 생략되면 사람도 못 가른다 —
  #     "절망적이야" 한 마디로는 내가 절망적인지 경기가 절망적인지 알 수 없다.
  #     그래서 자기 지향이 문법적으로 드러나는 5종만 넣었다
  #     (절망밖에·절망뿐·희망이안보여·희망이하나도없·희망조차).
  #     놓치는 "절망적이야"는 미분류 → 선택 UI로 간다. 안전한 실패다.
  #     잔여 오탐 1건: "이 프로젝트는 희망이 안 보여".
  #
  #   ⛔ "세상이싫어"는 넣지 않았다. 존재가 아니라 대상에 대한 혐오다.
  #     참고한 어휘 목록도 이 단어를 슬픔이 아니라 분노 항목에 둔다.
  #
  # ---------------------------------------------------------------------
  # [전수 점검] 2026-08-18 — 기존 위기 키워드의 자기 지향 검사
  #   위 [어간 원칙]의 검사를 45종 전체에 돌린 결과, 사물·타인·장소를 주어로
  #   붙였을 때 자연스러운 문장이 만들어지는 것이 다음과 같이 남아 있다.
  #   좁히는 것은 실제 위기를 놓칠 위험이 있어, 자기 지향 표현이 보존되는지
  #   키워드마다 따로 재고 나서 처리했다. 결과는 셋으로 갈렸다.
  #
  #   [고쳤다]
  #     세상에없 → 내가세상에없 · 나는세상에없 · 세상에없는게나
  #       "그런 완벽한 사람은 세상에 없어"가 위기였다.
  #       좁혀도 자기 지향 3/3 유지, 일상 3/3 제거. 불일치 0건.
  #     아무도날 → 위기에서 빼고 sadness.lonely로 옮겼다
  #       "아무도 날 안 도와줘", "아무도 날 기다리지 않아"는 외로움이지
  #       존재에 대한 판단이 아니다. 애초에 위기 키워드가 아니었어야 했다.
  #       (기존 sadness.lonely의 "아무도날찾"은 이것에 포함되므로 교체했다.)
  #
  #   [의도적으로 두었다 — 좁히면 더 위험하다]
  #     살기싫 / 살고싶지않 / 그만살 / 다포기하고싶
  #       살다(거주)와 살다(생존)가 같은 어간이라 "이 동네 살기 싫어"가 걸린다.
  #       그런데 좁혀 보니 **가장 흔한 위기 표현이 전부 빠졌다** — 실측에서
  #       "살기 싫어", "살기 싫다", "진짜 살기 싫어", "요즘 살기 싫어"가 모두 미포착.
  #       "의미가없"과 결정적으로 다른 지점이다. 그쪽은 좁혀도 자기 지향이
  #       100% 보존됐지만 이쪽은 좁히는 순간 본체를 잃는다.
  #       오탐은 상담 안내가 뜨는 방향이고 좁히면 놓치는 방향이라, 이 프로젝트가
  #       일관되게 택해온 쪽으로 둔다.
  #
  #     ⚠ 끝내고싶 — 감수 중이지만 가장 마음에 걸리는 항목이다.
  #       "이 일을 빨리 끝내고 싶어", "과제를 오늘 끝내고 싶어", "회의를 끝내고 싶다"가
  #       전부 위기로 간다. **업무 스트레스는 이 앱의 주 용도라 매우 흔할 입력이다.**
  #       그런데 자기 지향 형태("다 끝내고 싶어", "이제 그만 끝내고 싶어")도 목적어가
  #       생략되는 경우가 많아 좁힐 방법을 찾지 못했다.
  #       → 실패 기록(app/src/lib/failures.js)과 오탐 제보가 쌓이면 재검토할 지점이다.
  #         재검토 시 볼 것: 업무 문맥에서 실제로 얼마나 뜨는가, 자기 지향 표현 중
  #         목적어가 붙는 비율("인생을/삶을 끝내고 싶어")이 얼마나 되는가.
  #
  #   [개연성이 낮아 손대지 않았다]
  #     자해("자해 공갈단"), 살아야할이유("이 회사가 살아야 할 이유"),
  #     사라지고싶(무생물 주어는 비문에 가깝다), 안깨어나("애가 아침에 안 깨어나").
  crisis_keywords:
    [죽고싶, 죽어버리, 죽고파, 사라지고싶, 없어지고싶, 자해, 살기싫, 살고싶지않, 끝내고싶, 그만살, 살아야할이유, 다포기하고싶, 내가없어지, 눈뜨고싶지않,
     안깨어나, 나를죽이, 나죽이고싶, 나를죽여, 나죽여버리, 나를없애, 나만없으면, 내가없어야, 나같은건없, 내가사라지는게, 내가사라져야, 살자격이없, 짐만되는,
     태어나지말았, 왜태어났을까, 왜태어났는지모르, 왜태어났나, 내가왜태어났, 태어난이유를모르, 태어난이유가없, 내가태어난이유가뭘, 내가태어난이유가뭔, 존재이유가없,
     내존재이유가뭘, 내존재이유가뭔, 왜사는지모르겠, 왜살아야하는지모르, 왜살아야할지모르, 사는게의미가없, 살의미가없, 살아갈의미가없, 존재의미가없, 자포자기,
     절망밖에, 절망뿐, 희망이안보여, 희망이하나도없, 희망조차, 내가세상에없, 나는세상에없, 세상에없는게나]
  crisis_response:
    message: >
      지금 마음이 많이 힘드신 것 같아요. 혼자 견디지 않으셔도 됩니다.
      전문 상담원과 이야기해보시는 건 어떨까요. 24시간 언제든 연결돼요.
    resources:
      - name: 자살예방 상담전화
        number: "109"
      - name: 정신건강 위기상담전화
        number: "1577-0199"
    # --- 위기 상황 콘텐츠 정책 (일반 추천과 완전히 분리) ---
    content_policy:
      show_videos: true
      placement: 상담 안내 아래에 배치. 상담 안내가 화면 최상단·최대 강조로 항상 먼저 보인다.
      source: api_search_with_guardrails
      source_note: >
        일반 카테고리와 동일하게 배치 검색(YouTube API)으로 매일 갱신한다.
        고정 목록은 금방 낡고 운영 부담이 커서 쓰지 않는다.
        대신 이 카테고리에만 아래 3중 가드레일을 적용해 검색 결과를 걸러낸다.
      framing: >
        "추천" 표현을 쓰지 않는다. "지금 곁에 두면 좋을 것들" 정도의 조용한 문구로 제시.
        자동재생 금지, 노출 개수 4~6개로 제한(선택 부담 최소화).
        매 방문 시 확보된 풀에서 랜덤 노출해 같은 영상이 고정되지 않게 한다.

      # --- 가드레일 1: 검색어 자체를 안전한 방향으로만 설계 ---
      search_queries:
        - 마음이 편안해지는 자연 소리
        - 호흡 이완 명상 가이드
        - 잔잔한 파도 소리 긴 영상
        - 따뜻한 위로가 되는 이야기
        - 숲속 풍경 힐링 영상
        - 마음 진정되는 피아노
      # 감정 몰입·자극을 유도하는 검색어는 이 카테고리에서 사용 금지
      forbidden_query_patterns: ["우울할 때", "슬플 때 듣는", "눈물", "이별", "죽음", "극복"]

      # --- 가드레일 2: 채널 단위 화이트리스트 (운영 부담이 낮은 지점) ---
      channel_allowlist:
        enabled: true
        rationale: >
          영상 단위 큐레이션은 매일 관리해야 하지만, 채널 단위는 한 번 정하면
          거의 바뀌지 않는다. 신뢰할 만한 채널에서 나온 새 영상은 자동으로
          들어오므로 신선도와 안전성을 동시에 얻는다.
          운영 점검 주기: 분기 1회 정도면 충분.
        selection_criteria:
          - 이완·명상·자연 소리·수면 등 정적인 콘텐츠를 꾸준히 올리는 채널
          - 자극적 썸네일·낚시성 제목을 쓰지 않는 채널
          - 공신력 있는 정신건강 기관·전문가 채널
        target_size: 15~25개 채널
        fallback_if_empty: 화이트리스트 결과가 부족하면 일반 검색으로 보충하되 가드레일 3을 반드시 통과시킨다
        managed_in: channel_allowlist.yaml   # 이 파일 한 곳에서만 관리. 변경은 PR로만.
        required_fields_per_channel: [channel_id, channel_name, added_at, last_reviewed_at, reviewed_by, note]
        auto_alerts:                          # 사람이 잊어도 시스템이 먼저 알린다
          - 채널이 삭제·비공개되면 Issue 자동 생성
          - 최근 90일 업로드가 없으면 Issue 자동 생성
          - 최근 영상의 blocklist 필터 통과율이 50% 미만이면 Issue 자동 생성 (채널 성향 변화 신호)
          - last_reviewed_at이 120일을 넘기면 재검토 Issue 자동 생성
          - 화이트리스트가 15개 미만으로 줄면 경고 Issue 생성 (풀 고갈 방지)
        review_cycle: 분기 1회 전체 재검토 — 상세 절차는 OPERATIONS.md 참조

      # --- 가드레일 3: 배치 단계 자동 필터 (제목 검사) ---
      blocklist_terms: blocklist_tiers의 tier_a + tier_b + tier_c 전체를 적용 (가장 엄격)
      filter_rules:
        - 제목에 blocklist_terms가 하나라도 포함되면 제외 (설명·태그는 보지 않는다)
        - 영상 길이 3분 미만 제외 (짧은 자극형 콘텐츠 배제)
        - Shorts 제외
        - 댓글 사용 중지된 영상 우선 (댓글 노출 위험 회피)
        - 채널을 순회하며 1건씩 채운다 (selection_method), 한 채널이 max_per_channel을 넘지 않는다
        - 최소 확보 개수 12개 미달 시 필터를 완화하지 않고 직전 배치 결과를 유지한다
      blocklist_scope_rationale: >
        설명란에는 해시태그·링크·채널 소개·상담 안내가 뒤섞여 있어, 영상 내용과 무관한
        문자열에 blocklist가 걸린다. 특히 자살예방 상담전화를 성실히 적어둔 채널이
        tier_a의 "자살"에 잡혀 제외되는 역설이 구조적으로 발생했다.
        태그는 사용자에게 보이지 않는 필드라 노출 판단 근거가 될 수 없다.
        사용자가 실제로 읽는 것은 제목이므로 제목만 검사한다.
        (썸네일은 자동으로 볼 수 없어 사람 검토에 맡긴다 — OPERATIONS.md)

      # --- 채널 편중 방지 (위기 카테고리 전용) ---
      selection_method: round_robin
      selection_method_rationale: >
        채널을 순회하며 1건씩 채우고, 채널당 상한에 도달할 때까지 반복한다.
        채널 내부 순서는 기존 정렬(화이트리스트 우선 → 댓글 사용 중지 → 후보 순위)을 유지한다.
        순회 시작 지점은 day_of_year로 매일 회전시킨다.
        회전이 필요한 이유: 정렬 순서가 매일 거의 같아 하위 채널이 구조적으로 배제되면,
        사람이 승인한 화이트리스트가 실질적으로 축소된다.
        상한만으로는 부족했다 — 상한 3을 적용해도 7채널 × 3건이 20슬롯을 채워버려
        순회 뒤쪽 3채널은 여전히 0건이었고, 순서가 고정이라 다음 날도 같은 3채널이 밀린다.
        순회는 화이트리스트 그룹을 먼저 끝까지 돌린 뒤 검색 결과 그룹으로 넘어가고,
        회전도 각 그룹 내부에서만 일어난다.
        두 그룹을 한 바퀴에 섞으면 채널 수가 20개를 넘는 순간 첫 바퀴만으로 슬롯이 차서
        화이트리스트가 20슬롯의 절반밖에 못 가져간다 (실측: 화이트리스트 10건 +
        검토받지 않은 검색 채널 10건). 화이트리스트 우선은 가드레일 2 자체라
        분산을 위해 양보할 대상이 아니다.

      max_per_channel: 3
      max_per_channel_rationale: >
        상한이 없으면 정렬 상위 채널이 20슬롯을 독식한다. 실측에서 화이트리스트
        10채널 중 2채널이 20건 전부(14건 + 6건)를 차지했다. 한 채널의 성향·품질
        변화가 위기 카테고리 전체를 흔드는 상태이고, 사용자에게도 같은 채널의
        비슷한 영상만 반복 노출된다. 3건이면 20건이 최소 7채널로 분산된다.
        확보량이 20건에 못 미칠 때만 4, 5로 순차 완화한다 — 개수보다 분산이
        우선이기 때문이다. 다만 최소 확보 개수 12건은 분산보다 우선하므로,
        5까지 완화해도 12건이 안 되면 그때는 상한을 해제한다.
        일반 카테고리에는 적용하지 않는다.
      review: 배치 산출물 중 이 카테고리는 월 1회 사람이 샘플 점검한다

      closing_messages:
        - "오늘 이 마음을 꺼내주셔서 고마워요. 여기서 잠시 쉬었다 가요."
        - "말해줘서 고마워요. 지금은 아무것도 하지 않아도 괜찮아요."
        - "혼자 견디지 않으셔도 돼요. 오늘은 여기 머물러요."

# ---------------------------------------------------------------------
# 일반 카테고리 선정 규칙 (배치 전용 — 위기 카테고리는 content_policy가 따로 관리)
#
# 2026-08-16 신설. 그전까지 일반 카테고리는 순위 상위 20건을 그대로 잘랐고
# (build_videos.py의 `final = kept[:CATEGORY_MAX_VIDEOS]`) 채널 상한이 없었다.
# 그 결과 검색 상위를 한 채널이 쓸어담으면 그대로 20슬롯에 들어왔다.
#
#   실측 (배포본 기준)
#     2026-08-15  anger.rage        힐링포유 12/20 (60%), 20건이 9채널뿐
#                 boredom.novelty   EBSDocumentary 10/20 (50%)
#     2026-08-14  exhaustion.listless  소소한 일상 18/20 (90%)
#
# 날마다 편중되는 카테고리와 채널이 바뀐다. 특정 채널을 차단해도 다음 날
# 다른 채널이 같은 자리를 차지하므로 channel_blocklist로 풀 문제가 아니다.
# 사용자에게는 비슷한 썸네일이 반복되는 성의 없는 목록으로 보인다.
#
# 상한을 4가 아니라 3으로 둔 이유: 4로는 anger.rage에서 최다 채널이 여전히
# 4/20(20%)로 남아 반복 체감이 절반만 해소된다. 위기 카테고리도 3이라 값이 통일된다.
#
# 여유는 충분하다 — build_report.json의 surplus가 카테고리당 100건 내외다
# (예: anxiety.restless 후보 122건 중 20건 사용). 상한 3으로 20건을 채우는 데
# 필요한 것은 서로 다른 채널 7개뿐이고, 편중이 가장 심한 anger.rage조차
# 상위 20건 안에만 9채널이 있다.
# ---------------------------------------------------------------------
category_selection:
  max_per_channel: 3
  rationale: >
    채널을 라운드로빈으로 순회하며 1건씩 채우고, 한 채널이 3건을 넘게 가져가지 못한다.
    채널 순서는 "그 채널의 최상위 영상이 몇 등인가" — 즉 검색 관련성 순서이고,
    이 순서는 건드리지 않는다.
  no_rotation_note: >
    위기 카테고리와 달리 일별 회전(day_of_year)을 쓰지 않는다.
    넣었다가 검증에서 되돌렸다 (2026-08-16). 두 경우의 채널 목록이 다른 것이기 때문이다.
    위기는 사람이 승인한 화이트리스트 10개 안팎이라 슬롯(20)이 채널보다 많고,
    회전은 "전원이 돌아가며 들어온다"는 뜻이다. 일반은 관련성 순위대로 늘어선
    채널이 50~80개라 슬롯이 훨씬 적고, 회전은 "매일 다른 20채널 구간을 자른다"가 된다.
    실측(후보 132건·채널 61개 재현): day 20이면 상위 20채널이, day 40이면 상위 40채널이
    통째로 빠지고 하위권만 남았다. 편중을 고치려다 관련성을 잃는 거래가 된다.
    다양성은 회전 없이도 이미 나온다 — 검색어가 매일 3/4로 로테이션되므로
    후보 풀과 그 순서가 날마다 달라진다.
  ordering_note: >
    라운드로빈은 채널을 번갈아 뽑으므로 최종 목록이 채널 단위로 섞인다.
    같은 채널 영상이 목록에서 서로 붙어 있지 않게 되는데, 보고된 증상이
    "비슷한 썸네일이 반복되어 성의 없어 보인다"였으므로 이 순서가 의도한 결과다.
    채널 안에서의 순서(검색 관련성 순위)는 그대로 유지된다.
  ladder_note: >
    상한 3으로 20건을 못 채우면 4, 5로 한 단계씩 올린다.
    그래도 최소 확보량 15건(PLAN.md 4절 "카테고리당 15~20개")에 미달하고
    상한을 풀면 채울 수 있는 경우에만 상한을 해제한다.
    분산보다 최소 확보량이 우선이다 — 위기 카테고리와 같은 판단이다.
    풀 자체가 얕아서(kept < 15) 미달인 경우에는 해제해도 소용없으므로 하지 않는다.

