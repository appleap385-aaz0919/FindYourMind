        # 2026-08-14 개정 (Phase 0 확정 검색어 수정)
        #   "따뜻한 라디오 사연"을 뺐다. "따뜻한"을 붙여도 검색 결과는
        #   "1살때 날 버린 친엄마", "아들이 죽자마자 돈 요구하는 며느리" 같은
