          - "눈치 보느라 애쓴 하루, 수고했어요."
          - "여기서는 아무 말 안 해도 돼요."
          - "속에 있는 걸 다 말하지 않아도, 알아요."
          - "참느라 애쓴 하루, 수고했어요."
          - "다 말하지 않아도 괜찮아요."
          - "당신 마음이 제일 중요해요."
          - "눈치 보지 않아도 되는 시간이에요."
          - "속엣말은 언젠가 꺼내도 돼요."

  - id: sadness
    label: 우울
    keywords: [우울]   # 대분류 폴백용 — 세분류가 하나도 안 걸릴 때만 쓴다
    subcategories:
      - id: sadness.sorrow
        label: 슬픔
        empathy_messages:   # 매번 랜덤으로 하나 표시
          - "마음이 많이 무거운 날이네요. 억지로 밝아지지 않아도 괜찮아요."
          - "오늘은 마음이 많이 가라앉았군요. 그대로 있어도 돼요."
          - "슬픈 마음이 느껴져요. 서둘러 괜찮아지지 않아도 돼요."
          - "힘든 하루였겠어요. 여기서 좀 쉬었다 가요."
          - "오늘은 마음이 참 무겁죠."
          - "괜찮은 척하지 않아도 돼요."
          - "울고 싶으면 울어도 되는 밤이에요."
          - "기분이 바닥까지 내려간 날이군요."
          - "웃음이 안 나는 날도 있어요."
          - "이유가 없어도 슬플 수 있어요."
        tone: 위로
        # 2026-08-16 추가 — 처지/쳐지 활용형 6종, 눅눅 3종 (미분류 제보)
        #
        #   ⛔ "처지"(2자)는 넣지 않는다. 다시 넣지 말 것.
        #     처지(處地)가 일상어다 — "내 처지가", "그 사람 처지도", "같은 처지라",
        #     "처지를 바꿔서". 실측에서 오탐 11건이 났다.
        #     "쳐지"도 마찬가지로 "고쳐지지 않아", "부딪쳐지는"에 걸린다.
        #     그래서 어간을 줄이지 않고 활용형을 하나씩 적는다.
        #
        #   ⛔ "처지는"·"쳐지는"도 뺐다. "성적이 처지는 편", "부딪쳐지는 일"에 걸린다.
        #     "처지네"·"쳐지네"는 같은 검사에서 오탐이 없어 넣었다.
        #
        #   눅눅은 주어를 고정한다. "눅눅"만 넣으면 과자·빨래·장마가 전부 걸린다
        #     (눅눅하다의 본래 용법이 물리적 습기다). 주어 고정 3종으로
        #     오탐 0건을 확인했다.
        #
        #   잔여 오탐 1건: "살이 처진다" → 슬픔. 신체 표현이고 이 앱 입력으로는
        #   드물다고 보고 감수한다. 어간을 더 좁히면 "기분이 처진다"를 놓친다.
        keywords: [슬픔, 슬퍼, 슬프, 눈물이, 눈물나, 울고싶, 울었, 마음이아파, 가슴이아파, 울적, 서글, 가라앉, 우울, 침울, 마음이무거, 기분이바닥, 다운돼,
                   축처지, 웃음이안나, 아무것도즐겁지, 세상이회색, ㅠㅠ, 흑흑, 훌쩍, 처진다, 쳐진다, 처져, 쳐져, 처지네, 쳐지네, 기분이눅눅, 마음이눅눅,
                   눅눅한기분, 구슬프, 처량, 애끓, 비참, 마음이시리, 가슴이먹먹, 먹먹, 목이메, 쓰라리, 서글퍼, 눈시울, 구슬픈, 마음무거,
                   속상, 서운, 울음이북받]
        # 2026-08-16 개정 (Phase 0 확정 검색어 수정)
        #   "마음 어루만지는 이야기" → "마음 어루만지는 연주곡"
        #   "이야기"가 막장 가족 서사 낭독을 데려왔다. 실측에서 이 세분류 20건 중
        #   5건이 사연물이었고(Emotional Road 4 + 옛이야기 꽃피다 1) 목록 상단을 차지했다.
        #     "동창회에 남편을 데려갔는데, 선생님은 그를 보자마자 물컵을 떨어뜨리며…"
        #   frustration.suppressed의 "사연 읽기", sadness.lonely의 "라디오 사연"과
        #   같은 실수다 — 서사를 요구하는 단어가 들어가면 그 장르가 통째로 온다.
        #
        #   "음악"이 아니라 "연주곡"인 이유: 음악은 가사 있는 발라드를 부르는데,
        #   슬픔 카테고리에서 가사는 감정을 증폭시킬 수 있다. 완화·환기 원칙에 어긋난다.
        search_queries:
          - 따뜻하게 위로되는 음악
          - 마음 어루만지는 연주곡
          - 포근한 자연 영상
          - 잔잔한 힐링 브이로그
        closing_messages:   # 매번 랜덤으로 하나 표시
          - "오늘 이 마음을 알아차린 것만으로 충분해요."
          - "억지로 괜찮아지지 않아도 돼요."
          - "울어도 되는 밤이 있어요."
          - "슬픔은 나쁜 게 아니라, 소중한 게 있었다는 증거예요."
          - "오늘은 그냥 이대로 있어요."
          - "오늘은 그냥 슬퍼도 돼요."
          - "괜찮아지려 애쓰지 않아도 돼요."
          - "이 밤이 지나면 조금은 나아요."
          - "슬픔은 지나가요. 천천히요."
          - "여기까지 온 것만으로 충분해요."

      - id: sadness.lonely
