      - id: frustration.suppressed
        label: 억눌림
        empathy_messages:   # 매번 랜덤으로 하나 표시
          - "하고 싶은 말을 삼키고 계셨군요. 여기서는 그 마음 그대로 두어도 돼요."
          - "속에 담아둔 게 많아 보여요. 꺼내지 않아도 괜찮아요."
          - "눈치 보며 참느라 애쓰셨네요."
          - "말 못 하고 지나온 일들, 여기선 안 참아도 돼요."
          - "가슴에 뭐가 얹힌 것 같으시겠어요."
          - "참는 게 습관이 되어버렸군요."
          - "티 안 내느라 더 힘드셨겠어요."
          - "말하지 못한 마음도 사라지지 않아요."
          - "여기선 눈치 안 봐도 돼요."
          - "속에 담아둔 게 많아 보여요."
        tone: 공감
        keywords: [말못하고, 말을못, 참고있, 참느라, 속으로삭, 삭이, 숨막혀, 숨이턱, 얹힌것같, 체한것같, 표현못, 눈치보느라, 눈치보여, 꾹참, 억눌, 가슴이답답,
                   속이터, 하고싶은말, 삼키, 티도못내, 내색못, 혼자삭이, 말해봤자, 들어주지않, 옥죄, 숨통막, 짓눌린, 참고만]
        # 2026-08-14 개정 (Phase 0 확정 검색어 수정)
        #   "속 시원해지는 사연 읽기"를 뺐다. 이 검색어가 실제로 가져온 것은
        #   컬투쇼 사연 몰아보기·시월드 복수극·"참교육" 실화사연이었다.
        #   타인의 불행을 구경거리로 소비하는 콘텐츠이며, 억눌린 감정을 풀어주는 게
        #   아니라 분노를 대리 배출시키는 방향이라 완화·환기 원칙에 어긋난다.
        #   실측: 이 세분류 20건이 전부 사연 콘텐츠였다.
        #   기존 "마음 털어놓는 심리 상담 영상"과 "감정 표현 연습 강연"은
        #   새 검색어와 사실상 같은 질의라 중복 호출(각 100 units)을 피해 통합했다.
        #
        # 2026-08-14 재개정 — "속마음 정리하는 시간" → "감정 일기 쓰는 법"
        #   ⚠ "속마음"은 한국 유튜브에서 사실상 연애 타로의 관용어다.
        #     이 단어를 쓰면 검색 결과가 그쪽으로 수렴한다. 실측에서 상위 5건 중
        #     4건이 타로·재회 콘텐츠였다:
        #       "[타로]💕지금 상대방이 전하는 찐 속마음❤️‍🔥"
        #       "헤어진 후 연락을 끊었을 때 일어나는 상대방 속마음 | 재회가…"
        #     억눌린 감정을 표현하도록 돕는다는 취지와 무관하고, 타로는 불안한
        #     상태의 사용자에게 권할 콘텐츠도 아니다.
        #   같은 이유로 "말하지 못한 마음 정리"도 후보에서 뺐다 — "마음"을
        #   대상 인물과 엮는 구조라 같은 함정에 빠진다.
        #   "감정 일기"는 혼자 자기 감정을 다루는 행위라 타인이 개입할 여지가 없다.
        search_queries:
          - 마음 털어놓는 심리 상담
          - 후련해지는 노래
          - 감정 표현하는 법
          - 감정 일기 쓰는 법
        closing_messages:   # 매번 랜덤으로 하나 표시
          - "참는 게 익숙해도, 당신 마음이 제일 먼저예요."
          - "삼킨 말도 사라지지 않아요. 언젠가 꺼내도 돼요."
          - "눈치 보느라 애쓴 하루, 수고했어요."
          - "여기서는 아무 말 안 해도 돼요."
          - "속에 있는 걸 다 말하지 않아도, 알아요."
          - "참느라 애쓴 하루, 수고했어요."
          - "다 말하지 않아도 괜찮아요."
          - "당신 마음이 제일 중요해요."
          - "눈치 보지 않아도 되는 시간이에요."
          - "속엣말은 언젠가 꺼내도 돼요."

