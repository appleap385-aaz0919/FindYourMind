# =====================================================================
# channel_allowlist.yaml — 위기 카테고리 채널 화이트리스트 (가드레일 2)
#
# 이 파일이 채널을 관리하는 유일한 곳이다. 다른 곳에 흩어두지 않는다.
# 변경은 반드시 PR로만 한다 — 누가 왜 바꿨는지 이력이 남아야 한다.
#   (PLAN.md Phase 4.5 "화이트리스트 관리 절차" 1~2)
#
# ---------------------------------------------------------------------
# 채널 선정 기준 (taxonomy.yaml selection_criteria)
#   1. 이완·명상·자연 소리·수면 등 정적인 콘텐츠를 꾸준히 올리는 채널
#   2. 자극적 썸네일·낚시성 제목을 쓰지 않는 채널
#   3. 공신력 있는 정신건강 기관·전문가 채널
#
# 목표 규모: 15~25개 채널
#   15개 미만으로 줄면 배치가 경고 Issue를 자동 생성한다 (풀 고갈 방지).
#
# ---------------------------------------------------------------------
# 필수 필드 (taxonomy.yaml required_fields_per_channel — 하나라도 비면 배치가 실패한다)
#   channel_id        YouTube 채널 ID. "UC"로 시작하는 24자.
#                     핸들(@name)이나 채널 URL이 아니라 반드시 ID여야 한다.
#                     확인 방법: 채널 페이지 → 공유 → 채널 ID 복사
#   channel_name      사람이 알아볼 이름. Issue 제목에 그대로 쓰인다.
#   added_at          최초 추가일 (YYYY-MM-DD)
#   last_reviewed_at  마지막 사람 검토일 (YYYY-MM-DD)
#                     120일이 지나면 재검토 Issue가 자동 생성된다.
#   reviewed_by       검토한 사람. 인수인계 시 문의 대상이 된다.
#   note              왜 이 채널인가. 선정 기준 1~3 중 무엇에 해당하는지 남긴다.
#
# ---------------------------------------------------------------------
# 배치가 이 파일을 쓰는 방식
#   channels.list로 uploads 재생목록 ID를 얻고 → playlistItems.list로 최근 업로드를 읽는다.
#   채널당 1 unit이다. search.list(channelId=...)는 채널당 100 units라 쓰지 않는다.
#   수집한 영상도 blocklist(tier a+b+c)와 3분 미만 필터를 그대로 통과해야 한다.
#   화이트리스트는 "믿을 만한 출처"일 뿐 필터 면제권이 아니다.
#
# ---------------------------------------------------------------------
# 현재 등록: 10개 (목표 15~25개)
#   15개 미만이라 배치가 allowlist_undersized 경보를 매 실행마다 생성한다.
#   보충 전까지는 정상 동작이며, 위기 카테고리는 전용 검색 fallback으로 채워진다.
#   후보는 `python scripts/suggest_channels.py`로 다시 뽑을 수 있다.
#
# 2026-08-12 최초 등록 — channel_candidates.md 상위 30개 중 사람이 10개를 선별.
#   선별 대상은 전부 blocklist 통과율 100%였고, 자동 점검도 모두 통과했다.
# =====================================================================

