# =====================================================================
# channel_blocklist.yaml — 채널 단위 차단 목록
#
# channel_allowlist.yaml의 반대 개념이다. 다만 적용 범위가 다르다.
#   화이트리스트  위기 카테고리에만 적용. "이 채널만 쓴다"
#   블록리스트    일반 카테고리 + 위기 전부에 적용. "이 채널은 쓰지 않는다"
#
# 변경은 반드시 PR로만 한다 — 누가 왜 막았는지 이력이 남아야 한다.
#
# ---------------------------------------------------------------------
# 왜 채널 단위가 필요한가
#
# 제목 blocklist로는 잡히지 않는 유형이 있다. 대표적으로 막장 가족 서사 낭독이다.
#
#     "동창회에 남편을 데려갔는데, 선생님은 그를 보자마자 물컵을 떨어뜨리며…"
#     "내가 서울대에 합격하자, 새아버지는 나를 위해 갈비찜을 한 냄비…"
#
# blocklist 용어가 하나도 없다. 이 장르의 제목은 낚시 문장으로 설계되어 있어서,
# 제목으로 잡으려면 "남편"·"합격" 같은 일상어를 넣어야 하는데 그건 오탐 폭탄이다.
#
# 반면 채널은 안정적인 단위다. 이런 채널은 이 콘텐츠만 만든다.
# 채널을 막으면 앞으로 올라올 영상까지 막힌다 — 제목 필터가 할 수 없는 일이다.
#
# ---------------------------------------------------------------------
# 한계 — 이것만으로는 부족하다
#
# 두더지 잡기다. 같은 장르의 채널은 수천 개고, 하나를 막으면 다음이 들어온다.
# 근본 해법은 그런 콘텐츠를 부르지 않는 검색어 설계다(taxonomy.yaml search_queries).
# 이 파일은 검색어를 고쳐도 새는 것을 잡는 안전망이며, 주된 방어선이 아니다.
#
# 목록이 빠르게 길어진다면 그것은 검색어에 문제가 있다는 신호다.
# 채널을 더 막기 전에 어떤 검색어가 데려왔는지 먼저 확인한다.
#
# ---------------------------------------------------------------------
# 필수 필드 (하나라도 비면 배치가 실패한다)
#   channel_id     YouTube 채널 ID. "UC"로 시작하는 24자.
#                  확인 방법: 해당 영상의 videoId로 videos.list를 부르면
#                  snippet.channelId에 들어 있다 (1 unit).
#   channel_name   사람이 알아볼 이름
#   added_at       추가일 (YYYY-MM-DD)
#   added_by       추가한 사람
#   reason         왜 막았는가. 제목 필터로 왜 안 되는지까지 적는다.
#
# 추가 절차는 OPERATIONS.md "채널 차단 절차" 참조.
# =====================================================================

version: "1.0.0"

channels:
  - channel_id: UCEfLzRHtNtSaXTUc45XV5ww
    channel_name: Emotional Road
    added_at: "2026-08-16"
