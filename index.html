<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141E24" />
    <meta name="description" content="지금 마음에 어울리는 영상을 조용히 건네는 곳" />
    <title>FindYourMind</title>
    <link rel="manifest" href="/FindYourMind/manifest.webmanifest" />
    <!-- iOS는 manifest의 icons를 보지 않는다. 홈 화면 추가는 apple-touch-icon만 쓰며
         권장 크기가 180x180이다. 예전에는 192짜리를 가리키고 있었다. -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/FindYourMind/icons/icon-180.png"
    />
    <!-- 브라우저 탭 아이콘. 지금까지 아예 없어서 기본 빈 아이콘이 나왔다. -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/FindYourMind/icons/icon-192.png"
    />
    <!-- 폰트는 preconnect로 미리 연결해 두되, 실패해도 시스템 폰트로 읽힌다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #0B1216; }
    </style>
    <script type="module" crossorigin src="/FindYourMind/assets/index-CtX2WUI8.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
